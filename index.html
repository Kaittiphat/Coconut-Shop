<!DOCTYPE html>
<html lang="th">
<head>
    <meta charset="UTF-8">
    <meta name="viewport" content="width=device-width, initial-scale=1.0">
    <title>EATNOW - สั่งอาหารออนไลน์</title>
    <!-- Tailwind CSS CDN -->
    <script src="https://cdn.tailwindcss.com"></script>
    <link href="https://cdnjs.cloudflare.com/ajax/libs/font-awesome/6.0.0/css/all.min.css" rel="stylesheet">
    <style>
        /* CSS เพิ่มเติมภายในไฟล์เดียว */
        body {
            font-family: system-ui, -apple-system, BlinkMacSystemFont, 'Segoe UI', Roboto, Oxygen, Ubuntu, Cantarell, sans-serif;
        }
        ::-webkit-scrollbar {
            width: 6px;
        }
        ::-webkit-scrollbar-thumb {
            background: #cbd5e1;
            border-radius: 3px;
        }
        ::-webkit-scrollbar-thumb:hover {
            background: #94a3b8;
        }
    </style>
</head>
<body class="bg-gray-50 text-gray-800 font-sans antialiased min-h-screen flex flex-col justify-between">

    <!-- Header / Navbar -->
    <header class="sticky top-0 bg-white/80 backdrop-blur-md shadow-sm z-50">
        <div class="max-w-6xl mx-auto px-4 py-4 flex justify-between items-center">
            <h1 class="text-2xl font-bold text-emerald-600 tracking-tight">EAT<span class="text-gray-900">NOW</span></h1>
            <button id="cart-btn" class="relative bg-emerald-50 text-emerald-600 px-4 py-2 rounded-full font-medium hover:bg-emerald-100 transition flex items-center gap-2">
                <i class="fa-solid fa-cart-shopping"></i> 
                <span>ตะกร้า</span>
                <span id="cart-count" class="bg-emerald-600 text-white text-xs px-2 py-0.5 rounded-full ml-1">0</span>
            </button>
        </div>
    </header>

    <!-- Hero Section -->
    <section class="max-w-6xl mx-auto px-4 py-10 text-center">
        <h2 class="text-3xl md:text-5xl font-extrabold text-gray-900 mb-4">อร่อย สดใหม่ ส่งตรงถึงบ้านคุณ</h2>
        <p class="text-gray-500 text-base md:text-lg max-w-xl mx-auto">เลือกสรรเมนูโปรดของคุณจากร้านเรา แล้วรอรับความอร่อยได้ง่ายๆ เพียงไม่กี่คลิก</p>
    </section>

    <!-- Menu Grid -->
    <main class="max-w-6xl mx-auto px-4 pb-16 flex-grow w-full">
        <h3 class="text-xl font-bold mb-6 text-gray-800">เมนูแนะนำ</h3>
        <div id="menu-grid" class="grid grid-cols-1 sm:grid-cols-2 lg:grid-cols-3 gap-6">
            <!-- Items generated by JavaScript -->
        </div>
    </main>

    <!-- Slide-over Cart (ตะกร้าสินค้า) -->
    <div id="cart-modal" class="fixed inset-0 bg-black/50 z-50 hidden transition-opacity">
        <div class="fixed inset-y-0 right-0 max-w-md w-full bg-white shadow-xl p-6 flex flex-col justify-between">
            <div>
                <div class="flex justify-between items-center pb-4 border-b">
                    <h3 class="text-xl font-bold">รายการที่สั่ง</h3>
                    <button id="close-cart" class="text-gray-400 hover:text-gray-600 text-2xl">&times;</button>
                </div>
                <div id="cart-items" class="py-4 space-y-4 max-h-[60vh] overflow-y-auto">
                    <!-- Cart items will appear here -->
                </div>
            </div>
            
            <div class="border-t pt-4">
                <div class="flex justify-between text-lg font-bold mb-4">
                    <span>ราคารวมทั้งหมด:</span>
                    <span id="total-price" class="text-emerald-600">฿0</span>
                </div>
                <button onclick="checkout()" class="w-full bg-emerald-600 hover:bg-emerald-700 text-white font-medium py-3 rounded-xl transition shadow-md hover:shadow-lg">
                    ยืนยันการสั่งซื้อ
                </button>
            </div>
        </div>
    </div>

    <!-- Footer -->
    <footer class="bg-white border-t border-gray-100 py-6 text-center text-sm text-gray-400">
        &copy; 2026 EATNOW. All rights reserved.
    </footer>

    <!-- JavaScript (รวมไว้ในไฟล์เดียว) -->
    <script>
        // ข้อมูลรายการอาหาร
        const foodMenu = [
            { id: 1, name: "สเต๊กเนื้อพรีเมียม", price: 289, image: "https://images.unsplash.com/photo-1544025162-d76694265947?auto=format&fit=crop&w=500&q=80" },
            { id: 2, name: "พาสต้าคาร์โบนาร่า", price: 189, image: "https://images.unsplash.com/photo-1612874742237-6526221588e3?auto=format&fit=crop&w=500&q=80" },
            { id: 3, name: "สลัดอกไก่คลีน", price: 129, image: "https://images.unsplash.com/photo-1540420773420-3366772f4999?auto=format&fit=crop&w=500&q=80" },
            { id: 4, name: "เบอร์เกอร์ชีสคู่", price: 159, image: "https://images.unsplash.com/photo-1568901346375-23c9450c58cd?auto=format&fit=crop&w=500&q=80" },
            { id: 5, name: "พิซซ่าเตาถ่านฮาวายเอี้ยน", price: 299, image: "https://images.unsplash.com/photo-1513104890138-7c749659a591?auto=format&fit=crop&w=500&q=80" },
            { id: 6, name: "น้ำส้มคั้นสด 100%", price: 55, image: "https://images.unsplash.com/photo-1613478223719-2ab802602423?auto=format&fit=crop&w=500&q=80" }
        ];

        let cart = [];

        // แสดงเมนูอาหาร
        function renderMenu() {
            const menuGrid = document.getElementById("menu-grid");
            menuGrid.innerHTML = foodMenu.map(item => `
                <div class="bg-white rounded-2xl overflow-hidden shadow-sm hover:shadow-md transition group border border-gray-100 flex flex-col justify-between">
                    <div>
                        <img src="${item.image}" alt="${item.name}" class="w-full h-48 object-cover group-hover:scale-105 transition duration-300">
                        <div class="p-5">
                            <h4 class="font-bold text-lg text-gray-800 mb-1">${item.name}</h4>
                        </div>
                    </div>
                    <div class="p-5 pt-0 flex justify-between items-center">
                        <span class="text-xl font-extrabold text-emerald-600">฿${item.price}</span>
                        <button onclick="addToCart(${item.id})" class="bg-gray-900 hover:bg-emerald-600 text-white px-4 py-2 rounded-xl text-sm font-medium transition shadow-sm">
                            + เพิ่มลงตะกร้า
                        </button>
                    </div>
                </div>
            `).join('');
        }

        // เพิ่มสินค้าเข้าตะกร้า
        function addToCart(id) {
            const food = foodMenu.find(item => item.id === id);
            const existing = cart.find(item => item.id === id);

            if (existing) {
                existing.quantity += 1;
            } else {
                cart.push({ ...food, quantity: 1 });
            }
            updateCartUI();
        }

        // อัปเดต UI ตะกร้าสินค้า
        function updateCartUI() {
            const cartCount = document.getElementById("cart-count");
            const cartItems = document.getElementById("cart-items");
            const totalPrice = document.getElementById("total-price");

            const totalQty = cart.reduce((sum, item) => sum + item.quantity, 0);
            const totalAmount = cart.reduce((sum, item) => sum + (item.price * item.quantity), 0);

            cartCount.innerText = totalQty;
            totalPrice.innerText = `฿${totalAmount}`;

            if (cart.length === 0) {
                cartItems.innerHTML = `<p class="text-gray-400 text-center py-8">ไม่มีรายการในตะกร้า</p>`;
                return;
            }

            cartItems.innerHTML = cart.map(item => `
                <div class="flex justify-between items-center border-b pb-3">
                    <div>
                        <h5 class="font-medium text-gray-800">${item.name}</h5>
                        <p class="text-sm text-gray-500">฿${item.price} x ${item.quantity}</p>
                    </div>
                    <div class="flex items-center space-x-2">
                        <span class="font-bold text-emerald-600">฿${item.price * item.quantity}</span>
                        <button onclick="removeFromCart(${item.id})" class="text-red-400 hover:text-red-600 ml-2 font-bold text-lg">&times;</button>
                    </div>
                </div>
            `).join('');
        }

        // ลบสินค้าออกจากตะกร้า
        function removeFromCart(id) {
            cart = cart.filter(item => item.id !== id);
            updateCartUI();
        }

        // สลับการแสดงผลโมดอลตะกร้า
        const cartModal = document.getElementById("cart-modal");
        document.getElementById("cart-btn").addEventListener("click", () => cartModal.classList.remove("hidden"));
        document.getElementById("close-cart").addEventListener("click", () => cartModal.classList.add("hidden"));

        // ชำระเงิน
        function checkout() {
            if (cart.length === 0) {
                alert("กรุณาเลือกรายการอาหารก่อนสั่งซื้อ");
                return;
            }
            alert("ขอบคุณสำหรับการสั่งซื้อ! ทางร้านได้รับออเดอร์ของคุณเรียบร้อยแล้ว");
            cart = [];
            updateCartUI();
            cartModal.classList.add("hidden");
        }

        // เริ่มแสดงผลเมนูเมื่อโหลดหน้าเว็บ
        renderMenu();
    </script>
</body>
</html>
